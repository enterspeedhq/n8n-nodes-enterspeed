# The only way the package reaches npm: a version tag on main publishes it.
#
# n8n requires verified community nodes to be published from GitHub Actions with
# an npm provenance statement (from 1 May 2026). This workflow authenticates with
# npm trusted publishing: npm exchanges the job's GitHub OIDC token for a
# short-lived publish token, so no npm token is stored in the repository, and
# the package gets a provenance statement tying it to this workflow, repository
# and commit.
#
# One-time setup on npmjs.com (README → Releasing has the full steps):
#   @enterspeed/n8n-nodes-enterspeed → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: enterspeedhq
#     Repository:           n8n-nodes-enterspeed
#     Workflow filename:    publish.yml
#     Environment name:     (leave empty)
#   then set Publishing access to "Require two-factor authentication and
#   disallow tokens", and delete any NPM_TOKEN repository secret.
#
# Tags are the bare version (0.2.0), as `npm run release` creates them. A
# prerelease version (1.0.0-rc.1) fails at Publish: `n8n-node release` runs
# `npm publish` without the `--tag` npm requires for one.
#
# Only the last job holds `id-token: write`. Everything that installs or runs
# code from the registry (npm ci, lint, tests, build, the scanner via npx) runs
# in `verify` with read-only permissions and hands over the packed tarball; the
# publish job installs nothing and only runs `npm publish` on that tarball, so
# no other step can mint the OIDC token. Actions are pinned by commit SHA and
# nothing is restored from a cache.
#
# The main check below lives in this file, so a tag on a branch whose copy of it
# drops the check would still publish; only a tag ruleset limiting who can push
# `*.*.*` tags closes that (README → Releasing).

name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: Test, build, scan and pack
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, to check the tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is a release of main
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that isn't on main"
            exit 1
          fi

      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'

      # Same as CI: n8n-workflow drags in `isolated-vm`, a native module the
      # package never executes, so install scripts are skipped.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The checks n8n runs before it verifies a community node, on the files
      # npm is about to publish.
      - name: n8n community package scan
        run: npm run scan

      # The exact files the publish job releases.
      - name: Pack
        run: |
          mkdir -p pack
          npm pack --ignore-scripts --pack-destination pack
          ls -l pack

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      # Lets npm exchange the job's OIDC token for a publish token and sign
      # the provenance statement.
      id-token: write
      contents: read

    steps:
      - name: Use Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later; Node 24 ships with it.
      - name: Check the npm version
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is too old for trusted publishing (needs 11.5.1+)"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: pack

      # What `n8n-node release` did in CI (lint and build happen in verify):
      # `npm publish` with provenance on; npm authenticates with OIDC. A
      # tarball runs no package scripts, so n8n-node's prepublishOnly guard
      # doesn't apply; --ignore-scripts says so explicitly.
      - name: Publish
        run: npm publish "pack/enterspeed-n8n-nodes-enterspeed-${GITHUB_REF_NAME}.tgz" --provenance --access public --ignore-scripts
