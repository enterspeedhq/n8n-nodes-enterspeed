name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # n8n-workflow drags in `isolated-vm`, a native module we never execute
      # (it's only needed for its TypeScript types at build time and for
      # `NodeOperationError` at runtime). Skipping install scripts avoids a
      # slow, brittle native compile on the runner.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Start n8n
        env:
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
        run: |
          docker compose up -d
          timeout 120 bash -c 'until curl -sf http://localhost:5678/healthz; do sleep 2; done'

      - name: Create credential and import workflows
        env:
          ENTERSPEED_SOURCE_API_KEY: ${{ secrets.ENTERSPEED_SOURCE_API_KEY }}
          ENTERSPEED_ENVIRONMENT_API_KEY: ${{ secrets.ENTERSPEED_ENVIRONMENT_API_KEY }}
          N8N_CONTAINER: n8n-nodes-enterspeed-n8n-1
          # The templates, plus the Context Graph end-to-end checks' own workflows.
          N8N_WORKFLOW_DIRS: workflows/templates,e2e/workflows
        run: node scripts/setup.mjs

      - name: Execute workflow
        env:
          N8N_CONTAINER: n8n-nodes-enterspeed-n8n-1
        run: node scripts/execute-workflow.mjs

      # The SDK dev-server needs Node 26. Its native dependency (better-sqlite3)
      # downloads a prebuilt binary in its install script, which e2e/package.json
      # allows; the package's own install above skips scripts.
      - name: Use Node.js 26.x for the dev-server
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'

      - name: Install the dev-server
        working-directory: e2e
        run: npm install --no-package-lock

      # An empty graph on the dev-server; the round-trip template uploads an
      # export and reads it back, a malformed line must fail the run with the
      # graph's reason, and Delivery's 304 and 503 go through n8n's real errors.
      - name: Context Graph end to end
        env:
          N8N_CONTAINER: n8n-nodes-enterspeed-n8n-1
        run: node e2e/context-graph.mjs

      - name: Stop n8n
        if: always()
        run: docker compose down
